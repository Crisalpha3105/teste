<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Royal Garden</title><link rel="stylesheet" href="assets/css/style.css"></head><body>
<section id="login" class="login"><form id="loginForm" class="login-card"><h1>Royal Garden</h1><p>Controle de Manutenção de Interfones</p><label>E-mail</label><input id="email" type="email" required autocomplete="username"><label>Senha</label><input id="senha" type="password" minlength="8" required autocomplete="current-password"><button class="btn primary">Entrar</button><p id="erro" class="erro"></p></form></section>
<div id="sistema" hidden><header><div><h1>Royal Garden</h1><p>Manutenção de Interfones</p></div><div class="usuario"><b id="nomeUsuario"></b><span id="perfilUsuario"></span><button id="sair" class="btn light">Sair</button></div><nav><button data-page="inicio">Início</button><button data-page="novo" data-role="cliente">Nova solicitação</button><button data-page="solicitacoes">Solicitações</button><button data-page="historico">Histórico</button><button data-page="usuarios" data-role="admin">Usuários</button></nav></header><main>
<section id="inicio" class="page"><h2>Visão geral</h2><div class="cards"><article>Total<b id="total">0</b></article><article>Pendentes<b id="pendentes">0</b></article><article>Em manutenção<b id="manutencao">0</b></article><article>Resolvidos<b id="resolvidos">0</b></article></div></section>
<section id="novo" class="page"><h2>Nova solicitação</h2><form id="solicitacaoForm" class="panel grid"><label class="full">Cliente *<input id="cliente" required maxlength="150" placeholder="Digite o nome do cliente"></label><label>Bloco<input id="bloco" required></label><label>Apartamento<input id="apto" required></label><label>Prioridade<select id="prioridade"><option>Normal</option><option>Alta</option><option>Urgente</option></select></label><label class="full">Problema<textarea id="problema" required></textarea></label><button class="btn primary">Cadastrar</button></form></section>
<section id="solicitacoes" class="page"><h2>Solicitações</h2><div class="panel"><div class="filters"><input id="busca" placeholder="Buscar"><select id="status"><option value="">Todos os status</option><option>Pendente</option><option>Em manutenção</option><option>Pendente de retorno</option><option>Resolvido</option></select></div><div id="lista"></div></div></section>
<section id="historico" class="page"><h2>Histórico</h2><div id="hist" class="panel"></div></section>
<section id="usuarios" class="page"><h2>Usuários</h2><div class="admin"><form id="usuarioForm" class="panel grid"><h3>Novo acesso</h3><label>Nome<input id="uNome" required></label><label>E-mail<input id="uEmail" type="email" required></label><label>Perfil<select id="uPerfil"><option value="cliente">Cliente</option><option value="fornecedor">Fornecedor</option><option value="admin">Administrador</option></select></label><label>Senha<input id="uSenha" type="password" minlength="8" required></label><button class="btn primary">Criar usuário</button></form><div class="panel"><h3>Acessos cadastrados</h3><div id="listaUsuarios"></div></div></div></section>
</main><div id="modal" class="modal"><form id="retornoForm" class="modal-box"><button type="button" id="fechar" class="x">×</button><h2>Atualizar atendimento</h2><input id="edit" type="hidden"><label>Prestador<input id="prestador" required></label><label>Problema resolvido?<select id="resolvido" required><option value="">Selecione</option><option value="sim">Sim</option><option value="nao">Não</option></select></label><label>Motivo<select id="motivo"><option value="">Selecione</option><option>Necessita de peça</option><option>Precisa retornar ao local</option><option>Cliente ausente</option><option>Outro</option></select></label><label>O que foi feito?<textarea id="observacao" required></textarea></label><label>Complemento<textarea id="complemento"></textarea></label><button class="btn primary">Salvar retorno</button></form></div><div id="toast" class="toast"></div></div>
<script src="assets/js/storage.js"></script><script src="assets/js/app.js"></script></body></html>
