<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f4c81"><title>Manutenção de Interfones</title><link rel="stylesheet" href="assets/css/style.css"></head><body><header><h1>Controle de Manutenção de Interfones</h1><p>Cadastro, acompanhamento e conclusão dos atendimentos.</p><nav><button class="active" data-p="inicio">Início</button><button data-p="novo">Novo incidente</button><button data-p="acompanhar">Acompanhamento</button><button data-p="historico">Histórico</button></nav></header><main>
<section id="inicio" class="page active"><h2>Visão geral</h2><div class="cards"><div class="card kpi">Total<strong id="total">0</strong></div><div class="card kpi">Pendentes<strong id="pendentes">0</strong></div><div class="card kpi">Em manutenção<strong id="manutencao">0</strong></div><div class="card kpi">Retorno<strong id="retorno">0</strong></div><div class="card kpi">Resolvidos<strong id="resolvidos">0</strong></div></div><div class="card"><h3>Atendimentos recentes</h3><div id="recentes"></div></div></section>
<section id="novo" class="page"><h2>Novo incidente</h2><div class="card"><form id="cadastro"><div><label for="cliente">Nome do cliente *</label><input id="cliente" required maxlength="100"></div><div><label for="bloco">Bloco *</label><input id="bloco" required maxlength="30"></div><div><label for="apto">Apartamento *</label><input id="apto" required maxlength="20"></div><div><label for="prioridade">Prioridade</label><select id="prioridade"><option>Normal</option><option>Baixa</option><option>Alta</option><option>Urgente</option></select></div><div class="full"><label for="problema">Observação do problema *</label><textarea id="problema" required maxlength="800"></textarea></div><div class="full actions"><button class="btn primary">Cadastrar incidente</button><button type="reset" class="btn secondary">Limpar</button></div></form></div></section>
<section id="acompanhar" class="page"><h2>Acompanhamento</h2><div class="card"><div class="filters"><div><label for="busca">Buscar</label><input id="busca" placeholder="Cliente, protocolo, bloco ou apartamento"></div><div><label for="status">Status</label><select id="status"><option value="">Todos</option><option>Pendente</option><option>Em manutenção</option><option>Pendente de retorno</option><option>Resolvido</option></select></div><div><label for="fbloco">Bloco</label><select id="fbloco"><option value="">Todos</option></select></div><button id="limpar" class="btn secondary">Limpar filtros</button></div><div id="lista"></div></div></section>
<section id="historico" class="page"><h2>Histórico</h2><div class="card"><div id="hist"></div></div></section></main>
<div id="modal" class="modal" role="dialog" aria-modal="true"><div class="box"><div class="head"><h2>Atualizar atendimento</h2><button class="close" aria-label="Fechar">×</button></div><div id="resumo" class="summary"></div><form id="retornoForm"><input type="hidden" id="edit"><div><label for="prestador">Prestador de serviço *</label><input id="prestador" required maxlength="100"></div><div><label for="solucao">Problema resolvido? *</label><select id="solucao" required><option value="">Selecione</option><option value="sim">Sim</option><option value="nao">Não</option></select></div><div id="motivoBox" class="full" hidden><label for="motivo">Motivo da não resolução *</label><select id="motivo"><option value="">Selecione</option><option>Necessita de peça</option><option>Precisa retornar ao local</option><option>Cliente ausente</option><option>Avaliação técnica</option><option>Problema externo</option><option>Outro</option></select></div><div class="full"><label for="obsPrestador">Observação do prestador: o que foi feito no local? *</label><textarea id="obsPrestador" required maxlength="1000" placeholder="Descreva o diagnóstico, reparo e testes realizados."></textarea></div><div class="full"><label for="complemento">Observação complementar</label><textarea id="complemento" maxlength="800"></textarea></div><div class="full actions"><button class="btn primary">Salvar retorno</button><button type="button" class="btn secondary fechar">Cancelar</button></div></form></div></div><div id="toast" class="toast" role="status"></div><script src="assets/js/storage.js"></script><script src="assets/js/app.js"></script></body></html>
